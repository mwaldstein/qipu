name: link_navigation
description: "Connect notes and traverse between them"
template_folder: qipu
tier: 1
tags: [links, graph]
target:
  binary: qipu
  command_pattern: "qipu\\s+(\\S+)"
  health_check: "qipu --version"
  env:
    QIPU_STORE: "${AX_EVAL_FIXTURE_DIR}/.qipu"
task:
  prompt: |
    Set up a qipu store in this directory if needed. Create two notes: "Cats" and "Dogs".
    Connect them as related concepts, then confirm you can traverse from Cats to Dogs.
evaluation:
  gates:
    - type: script
      description: "Cats and Dogs exist and are connected by a related link"
      command: |
        set -e
        export QIPU_STORE=".qipu"
        cats_id=$(qipu search Cats --format records | awk '/^N / {print $2; exit}')
        dogs_id=$(qipu search Dogs --format records | awk '/^N / {print $2; exit}')
        test -n "$cats_id"
        test -n "$dogs_id"
        qipu link path "$cats_id" "$dogs_id" --format records | grep -q "related"
  judge:
    enabled: true
    rubric: rubrics/link_v1.yaml
    pass_threshold: 0.7
  composite:
    judge_weight: 0.4
    gate_weight: 0.4
    interaction_weight: 0.2
