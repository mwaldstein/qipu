name: search_basic
description: "Create notes and retrieve them by query"
template_folder: qipu
tier: 1
tags: [search, records]
target:
  binary: qipu
  command_pattern: "qipu\\s+(\\S+)"
  health_check: "qipu --version"
  env:
    QIPU_STORE: "${AX_EVAL_FIXTURE_DIR}/.qipu"
task:
  prompt: |
    Set up a qipu store in this directory if needed. Create three notes:
    - "Machine Learning" — about supervised learning
    - "Neural Networks" — about deep learning
    - "Data Science" — about data analysis
    Then find the note about neural networks, and separately find any note that mentions
    supervised learning. Confirm both lookups return the right note.
evaluation:
  gates:
    - type: command_output_contains
      command: qipu search "Neural Networks" --format records
      substring: "Neural Networks"
    - type: command_output_contains
      command: qipu search "supervised learning" --format records
      substring: "Machine Learning"
    - type: script
      description: "Exactly three notes exist in the store"
      command: |
        set -e
        count=$(qipu list --format records | grep -c '^N ')
        test "$count" -eq 3
