name: guidance_minimal
description: "Multi-step capture task against bare-bones fixture guidance"
template_folder: qipu_minimal
tier: 1
tags: [guidance-test, minimal-docs]
target:
  binary: qipu
  command_pattern: "qipu\\s+(\\S+)"
  health_check: "qipu --version"
  env:
    QIPU_STORE: "${AX_EVAL_FIXTURE_DIR}/.qipu"
task:
  prompt: |
    Capture notes about a distributed-systems project across these concerns: database migration,
    API design, monitoring, and deployment. Organize them with a shared tag and link related notes
    together. Then retrieve the related set as a single context bundle.
interaction:
  target_commands: required
evaluation:
  gates:
    - type: script
      description: "At least four project notes were captured"
      command: |
        set -e
        export QIPU_STORE=".qipu"
        test "$(qipu list --format records | grep -c '^N ')" -ge 4

  judge:
    enabled: true
    pass_threshold: 0.7
  composite:
    judge_weight: 0.4
    gate_weight: 0.4
    interaction_weight: 0.2
