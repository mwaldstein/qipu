name: context_retrieval
description: "Retrieve a tagged set of notes as an LLM context bundle"
template_folder: qipu
tier: 1
tags: [context, records, retrieval]
target:
  binary: qipu
  command_pattern: "qipu\\s+(\\S+)"
  health_check: "qipu --version"
  env:
    QIPU_STORE: "${AX_EVAL_FIXTURE_DIR}/.qipu"
task:
  prompt: |
    Set up a qipu store in this directory if needed. Create three notes about Rust programming:
    - "Rust Ownership" (tag: rust)
    - "Async Programming" (tag: rust)
    - "Error Handling" (tag: rust)
    Then retrieve all of your Rust notes together as a single context bundle suitable to hand
    to an LLM. Confirm all three notes appear in that bundle.
evaluation:
  gates:
    - type: command_output_contains
      command: qipu context --tag rust --format records --max-chars 12000
      substring: "Rust Ownership"
    - type: command_output_contains
      command: qipu context --tag rust --format records --max-chars 12000
      substring: "Async Programming"
    - type: command_output_contains
      command: qipu context --tag rust --format records --max-chars 12000
      substring: "Error Handling"
    - type: script
      description: "All three notes are retrievable through the rust context bundle"
      command: |
        set -e
        output=$(qipu context --tag rust --format records --max-chars 12000)
        printf '%s\n' "$output" | grep -q '^H qipu=1 records=1'
        printf '%s\n' "$output" | grep -q "Rust Ownership"
        printf '%s\n' "$output" | grep -q "Async Programming"
        printf '%s\n' "$output" | grep -q "Error Handling"
